<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Atagul Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060c;
  --neon:#5efcff;
  --neon2:#8a7dff;
  --text:#e6e9ff;
  --soft:#b9c2ff;
}

body{
  margin:0;
  background:radial-gradient(circle at top,#0d1022,#05060c);
  color:var(--text);
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

/* Ortadaki yazı */
#logo-text{
  font-family:'Orbitron',sans-serif;
  font-size:80px;
  color:var(--neon);
  position:relative;
  z-index:2;
  text-align:center;
  white-space:nowrap;
  letter-spacing:5px;
}

/* Duman efekti */
.smoke{
  position:absolute;
  width:40px;
  height:40px;
  background:rgba(94,252,255,0.3);
  border-radius:50%;
  filter:blur(15px);
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) scale(0);
  animation:smokeAnim 4s forwards;
}

@keyframes smokeAnim{
  0%{transform:translate(-50%, -50%) scale(0); opacity:0.6;}
  50%{transform:translate(-50%, -50%) scale(3); opacity:0.4;}
  100%{transform:translate(-50%, -50%) scale(4.5); opacity:0;}
}

/* Sonsuz animasyon için */
@keyframes floatSmoke{
  0%{transform:translate(-50%, -50%) rotate(0deg);}
  100%{transform:translate(-50%, -50%) rotate(360deg);}
}

</style>
</head>
<body>

<div id="logo-text">ATAGUL GAMES</div>

<script>
// Dumanları oluştur ve animasyon ekle
function createSmoke(){
  const count = 30; // Kaç duman olacak
  const body = document.body;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'smoke';
    // Her duman farklı süre ve dönüş açısı ile
    s.style.animationDelay = (i*0.15) + 's';
    s.style.animationDuration = (3 + Math.random()*2) + 's';
    s.style.transform = `translate(-50%, -50%) rotate(${Math.random()*360}deg) scale(0)`;
    body.appendChild(s);
  }
}

// Sonsuz dönen duman
function rotateSmoke(){
  const smokes = document.querySelectorAll('.smoke');
  smokes.forEach((s,i)=>{
    s.style.animationName = 'smokeAnim';
    s.style.animationIterationCount = 'infinite';
  });
}

// Başlat
createSmoke();
rotateSmoke();
</script>

</body>
</html>
